name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint (php -l)
        run: composer run-script lint

      - name: Unit tests (no server needed)
        run: vendor/bin/phpunit --testsuite unit

      - name: Build distributable archive
        run: composer archive --format=zip --dir=dist

  # Integration tests need a running HotKV server. There is no public HotKV
  # server image to pull here, so this job is informational only: point
  # HOTKV_TEST_URL at a server you build or already have access to (see
  # README.md) and re-enable the "if: false" guard below to run it in CI.
  integration:
    name: Integration tests (optional, needs a HotKV server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Replace this step with starting (or connecting to) a real HotKV
      # server and exporting its URL, then run the integration suite:
      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration
        env:
          HOTKV_TEST_URL: hotkv://127.0.0.1:6379
